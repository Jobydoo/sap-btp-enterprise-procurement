_schema-version: '3.1'
ID: btp-enterprise-procurement
version: 1.0.0
description: "Full-Stack Enterprise SAP BTP CapEx Procurement & Asset Hub with S/4HANA Integration & AI Copilot"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ---------------------------------------------------------------------------
  # CAP Application Service Module (Cloud Foundry Node.js Runtime)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
    requires:
      - name: btp-enterprise-procurement-db
      - name: btp-enterprise-procurement-uaa
      - name: btp-enterprise-procurement-dest
      - name: btp-enterprise-procurement-logging
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ---------------------------------------------------------------------------
  # Database Deployer Module (SAP HANA Cloud HDI Container)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: btp-enterprise-procurement-db

  # ---------------------------------------------------------------------------
  # Enterprise App Router Module (Secure Gateway & Reverse Proxy)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-app
    type: approuter.nodejs
    path: app/
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: btp-enterprise-procurement-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # ---------------------------------------------------------------------------
  # SAP BTP XSUAA Authorization & Trust Management Service
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-enterprise-procurement
        tenant-mode: dedicated

  # ---------------------------------------------------------------------------
  # SAP HANA Cloud HDI Container (Managed Database Service)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared

  # ---------------------------------------------------------------------------
  # SAP BTP Destination Service (S/4HANA & AI Core External Endpoints)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: S4HANA_CLOUD_DEST
                Description: "SAP S/4HANA Cloud Purchase Requisition OData v4 Endpoint"
                URL: https://my401234.s4hana.cloud.sap
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2SAMLBearerAssertion
              - Name: SAP_AI_CORE_DEST
                Description: "SAP AI Core Generative AI Hub Inference Endpoint"
                URL: https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2ClientCredentials

  # ---------------------------------------------------------------------------
  # SAP Audit Log Service (Regulatory & Compliance Trail)
  # ---------------------------------------------------------------------------
  - name: btp-enterprise-procurement-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: auditlog
      service-plan: standard
